name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        symfony: ['6.*', '7.*', '8.*']
        exclude:
          - php-version: '8.1'
            symfony: '8.*'

    name: PHP ${{ matrix.php-version }} / Symfony ${{ matrix.symfony }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_dblib, pdo, json
          tools: composer:v2
          coverage: none

      - name: Constrain Symfony version
        run: |
          composer require --no-update symfony/framework-bundle:${{ matrix.symfony }} symfony/console:${{ matrix.symfony }}

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --prefer-stable

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
